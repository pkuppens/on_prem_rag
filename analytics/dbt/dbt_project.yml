# dbt project config: tells dbt what this project is called and where to find each kind of file.
# Every path below is relative to this directory (analytics/dbt/).
name: on_prem_rag
version: "0.1.0"
config-version: 2
profile: on_prem_rag # which entry in profiles.yml holds the database connection

# --- Source directories: hand-written, under version control ---
# models/  SQL `select` statements. Each .sql file becomes one table or view, named after the file.
#          YAML files next to them add descriptions and tests.
# seeds/   Small, static CSV files (lookup/reference data, demo data). `dbt seed` loads each one as a
#          table named after the file. Not meant for real data volumes; that comes in through sources.
# tests/   "Singular" tests: a SQL query that selects the rows that break a rule. Zero rows = pass.
#          (Generic tests such as not_null/unique are declared in the models' YAML instead.)
# macros/  Reusable Jinja/SQL snippets, like functions, called from models with {{ my_macro(...) }}.
#          Empty for now; the first one arrives with #193 (category normalization).
# These four are dbt's defaults; they are listed explicitly so the layout is visible in one place.
# A directory that does not exist yet is simply skipped.
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

# --- Generated directories: build output, gitignored, safe to delete (`dbt clean`) ---
# target/        compiled SQL, run results, manifest.json, and the docs site from `dbt docs generate`
# dbt_packages/  third-party packages installed by `dbt deps` (from packages.yml, added in #192)
target-path: target
clean-targets: ["target", "dbt_packages"]

# Defaults per folder. `+materialized: view` means: create a view (just a saved query, no data copied).
# Other options are `table` (data stored, faster to read) and `incremental` (only new rows appended).
models:
  on_prem_rag:
    staging:
      +materialized: view
    intermediate:
      +materialized: view

# Variables: project-wide parameters, read in SQL with {{ var('name') }}. Override per run without editing code:
#   dbt build --vars '{wbso_period_start: "2026-01-01", wbso_period_end: "2026-12-31"}'
vars:
  # WBSO grant period that commits and hours are reported against (WBSO-AICM-2025-01 covers 2025).
  wbso_period_start: "2025-01-01"
  wbso_period_end: "2025-12-31"
  # Rows to keep per sampled model on the dev target, for fast iteration on large inputs. 0 = no sampling.
  # Never applied on the ci target (see int_wbso__commits_in_period.sql).
  dev_sample_rows: 0

# Column types for seeds. Without this dbt guesses types from the CSV contents.
seeds:
  on_prem_rag:
    example_hours_raw:
      +column_types:
        work_date: date
        hours: decimal(4, 2)
    # Copy of docs/project/hours/data/repositories.csv, which the Python pipeline still reads.
    # tests/assert_wbso_repositories_seed_matches_pipeline.sql fails when the two drift apart.
    wbso_repositories:
      +column_types:
        repo_name: varchar
        repo_description: varchar
        wbso_relevance: varchar
