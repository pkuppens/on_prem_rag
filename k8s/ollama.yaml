# LLM runtime: Ollama. Stateful model cache -> PVC. GPU is optional (see k8s/overlays note).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  namespace: onpremrag
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: onpremrag
  labels:
    app: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      # For GPU scheduling, add (on a GPU node pool):
      #   nodeSelector: { gpu: "true" }
      #   tolerations: [{ key: "nvidia.com/gpu", operator: "Exists", effect: "NoSchedule" }]
      #   and resources.limits: { nvidia.com/gpu: 1 }
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          readinessProbe:
            tcpSocket:
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-data
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: onpremrag
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
