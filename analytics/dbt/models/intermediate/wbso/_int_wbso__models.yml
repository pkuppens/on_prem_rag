version: 2

models:
  - name: int_wbso__commits_in_period
    description: >
      Commits whose date falls inside the WBSO period (vars wbso_period_start/end), joined to the tracked
      repositories. On the dev target, var dev_sample_rows > 0 keeps only the newest N commits.
    columns:
      - name: hash
        description: Commit SHA.
        data_tests:
          - unique
          - not_null
      - name: commit_date
        description: Commit date, always inside the WBSO period.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: "cast('{{ var(\"wbso_period_start\") }}' as date)"
                max_value: "cast('{{ var(\"wbso_period_end\") }}' as date)"
      - name: is_tracked_repo
        description: True when the commit's repository is listed in the wbso_repositories seed.
      - name: is_core_wbso_repo
        description: True when that repository is a core WBSO project.

  - name: int_wbso__sessions_deduped
    description: >
      One row per work session with duplicates and overlaps removed. SQL window-function equivalent of
      WBSODataValidator.validate_duplicates() / step_deduplicate in src/wbso/: duplicate session_id keeps the first by
      start time, a session starting before the latest end of earlier sessions is dropped. Python not replaced.
    columns:
      - name: session_id
        description: Session identifier; unique after deduplication.
        data_tests: [unique, not_null]
      - name: wbso_category
        description: Category from the normalize_wbso_category macro; UNMAPPED fails the test below.
        data_tests:
          - accepted_values:
              arguments:
                values: [AI_FRAMEWORK, ACCESS_CONTROL, PRIVACY_CLOUD, AUDIT_LOGGING, DATA_INTEGRITY, GENERAL_RD]
      - name: hours
        description: Session duration in hours, 0 to 24.
        data_tests:
          - hours_in_valid_range:
              arguments: { min_value: 0, max_value: 24 }
